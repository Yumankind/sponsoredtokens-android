# THE ONE FILE OF THE WRAPPER THAT CARRIES A DECISION, and the only one this repository holds.
#
# `gradlew`, `gradlew.bat` and `gradle-wrapper.jar` are not here: the jar is a binary that the
# machine which wrote this library could not produce, and a `gradlew` without its jar fails with a
# missing-class stack trace instead of an honest "there is no wrapper". Generate all three with the
# Gradle you already have, which is what CI and JitPack both do:
#
#     gradle wrapper --gradle-version 8.11.1
#
# and this file is what pins the number they use. CI checks that it matches the version in
# .github/workflows/ci.yml, so the two can never quietly drift.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
