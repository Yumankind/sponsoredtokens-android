# THE COORDINATES. `group` and `version` are read by `maven-publish` straight off the project, and
# JitPack overrides both on the command line (`-Pgroup=com.github.Yumankind.sponsoredtokens-android
# -Pversion=<tag>`), which is why nothing in a build script ever assigns them: an assignment in a
# build script runs after the property is set and would silently win.
group=com.sponsoredtokens
version=0.1.0

org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
